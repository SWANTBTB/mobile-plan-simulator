{% extends "base.html" %}

{% block title %}7社比較結果 | 料金シミュレーター{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/simulator-ui.css') }}?v=20260821p8d" />
<script type="application/json" id="simulator-config">{{ simulator_config | tojson }}</script>
<script defer src="{{ url_for('static', filename='js/simulator-state.js') }}?v=20260821p8d"></script>
<script defer src="{{ url_for('static', filename='js/compare-ui.js') }}?v=20260821p5"></script>
<script defer src="{{ url_for('static', filename='js/compare-page.js') }}?v=20260821p8d"></script>
{% endblock %}

{% block content %}
<main class="compare-page-shell mx-auto flex w-full max-w-[1400px] flex-col gap-6 px-5 py-7 sm:px-8 lg:px-6 lg:py-5" data-page="compare">

  <header class="shrink-0">
    <nav class="mb-2 text-[13px] text-slate-500" aria-label="パンくず">
      <a href="/" class="font-medium text-blue-600 hover:underline">料金シミュレーター</a>
      <span class="mx-1" aria-hidden="true">›</span>
      <span class="text-slate-700">7社比較</span>
    </nav>
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <h1 class="text-[28px] font-bold tracking-tight text-slate-900 lg:text-[24px]">7社比較結果</h1>
        <p class="mt-1 text-[14px] leading-relaxed text-slate-500 lg:text-[13px]">同一条件での請求額・還元・実質負担の横断比較</p>
      </div>
      <button
        type="button"
        id="compare-edit-button"
        class="shrink-0 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-[14px] font-semibold text-slate-800 transition hover:border-slate-400 hover:bg-slate-50"
      >
        条件を変更する
      </button>
    </div>
  </header>

  <section id="compare-empty-state" class="hidden rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm" aria-live="polite">
    <p id="compare-empty-message" class="text-[15px] leading-relaxed text-slate-700">比較条件がありません</p>
    <button
      type="button"
      id="compare-empty-back-button"
      class="mt-4 rounded-lg bg-blue-600 px-5 py-2.5 text-[14px] font-semibold text-white transition hover:bg-blue-700"
    >
      条件を入力する
    </button>
  </section>

  <div id="compare-content" class="flex flex-col gap-4">
    <div id="compare-conditions-summary" aria-live="polite"></div>
    {% with compare_page=true %}
      {% include "components/compare_result.html" %}
    {% endwith %}
  </div>

</main>
{% endblock %}
