<div class="section-header flex shrink-0 items-center gap-3 border-b border-slate-200 px-5 py-4">
  <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-blue-600 text-[13px] font-bold text-white">
    {{ step }}
  </span>
  <div class="min-w-0">
    <h2 class="text-[18px] font-bold leading-tight text-slate-900">{{ title }}</h2>
    {% if description %}
    <p class="mt-1 text-[13px] leading-relaxed text-slate-500">{{ description }}</p>
    {% endif %}
  </div>
</div>
